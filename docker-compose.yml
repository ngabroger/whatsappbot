version: '3.3'

services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    ports:
      - "3601:3000"
    volumes:
      # Persist WhatsApp session
      - ./wwebjs_auth:/app/.wwebjs_auth
      # Persist uploads
      - ./uploads:/app/uploads
      # Mount environment file
      - ./.env:/app/.env:ro
    # Use tmpfs for Chromium user data (prevents lock issues)
    tmpfs:
      - /tmp:size=512M
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    restart: unless-stopped
    networks:
      - whatsapp-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Important: Increase shared memory size for Chromium
    shm_size: '2gb'
    # Optional: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

networks:
  whatsapp-network:
    driver: bridge

volumes:
  wwebjs_auth:
  uploads:
