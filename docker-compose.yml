version: '3.3'

services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    ports:
      - "3601:3000"
    volumes:
      # Persist WhatsApp session
      - ./wwebjs_auth:/app/.wwebjs_auth
      # Persist uploads
      - ./uploads:/app/uploads
    # Load .env file
    env_file:
      - .env
    # Use tmpfs for Chromium user data (prevents lock issues)
    tmpfs:
      - /tmp:size=512M
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    restart: unless-stopped
    networks:
      - whatsapp-network
    # Increase shared memory size for Chromium
    shm_size: '2gb'

networks:
  whatsapp-network:
    driver: bridge

volumes:
  wwebjs_auth:
  uploads:
