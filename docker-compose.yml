version: '3.3'

services:
  whatsapp-bot:
    build: .
    container_name: whatsapp-bot
    ports:
      - "3601:3000"
    volumes:
      # Persist WhatsApp session
      - ./wwebjs_auth:/app/.wwebjs_auth
      # Persist uploads
      - ./uploads:/app/uploads
      # Mount source code (biar perubahan langsung kebaca)
      - ./index.js:/app/index.js
      - ./api.js:/app/api.js
      - ./client.js:/app/client.js
      - ./controllers:/app/controllers
      - ./routes:/app/routes
      - ./middleware:/app/middleware
      - ./config:/app/config
    env_file:
      - .env
    tmpfs:
      - /tmp:size=512M
    environment:
      - NODE_ENV=production
      - TZ=Asia/Jakarta
    restart: unless-stopped
    networks:
      - whatsapp-network
    shm_size: '2gb'

networks:
  whatsapp-network:
    driver: bridge

volumes:
  wwebjs_auth:
  uploads:
